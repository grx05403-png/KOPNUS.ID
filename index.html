<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Tebak Angka • Game Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-card">
        <h1>
            🎯 Tebak
            <span>1–100</span>
        </h1>
        <div class="subhead">🔮 coba tebak angka rahasia</div>

        <!-- range info -->
        <div class="range-box">
            <i>🎯</i> 1 — 100
        </div>

        <!-- input & button -->
        <div class="guess-area">
            <input type="number" id="guessInput" placeholder="?" min="1" max="100" value="" autofocus>
            <button id="guessBtn">Tebak!</button>
        </div>

        <!-- pesan -->
        <div class="message-box" id="messageDisplay">
            💡 Masukkan angka lalu tekan Tebak
        </div>

        <!-- status -->
        <div class="status-chip">
            <div>🎲 <span id="attemptDisplay">0</span></div>
            <div class="attempt-badge">💬 <span id="hintDisplay">-</span></div>
        </div>

        <!-- reset -->
        <button class="btn-reset" id="resetBtn">⟳ Mulai ulang</button>
        <div class="footer-hint">⬆️ tebakan lebih tinggi • ⬇️ lebih rendah</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
