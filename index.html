<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍉 Fruit Spin • Game Slot Edukasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🍒 Fruit Spin</h1>
        <p class="subtitle">✨ Spin & dapatkan kombinasi buah terbanyak!</p>

        <!-- Skor & Koin -->
        <div class="stats">
            <div class="stat-box">
                <span>⭐ Skor</span>
                <span id="scoreDisplay">0</span>
            </div>
            <div class="stat-box">
                <span>🔄 Spin</span>
                <span id="spinCount">0</span>
            </div>
            <div class="stat-box">
                <span>🏆 Combo</span>
                <span id="comboDisplay">0</span>
            </div>
        </div>

        <!-- Mesin Slot -->
        <div class="slot-machine">
            <div class="reels-container">
                <div class="reel" id="reel1">
                    <div class="reel-inner">
                        <div class="fruit-item">🍒</div>
                        <div class="fruit-item">🍋</div>
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                        <div class="fruit-item">🍒</div>
                        <div class="fruit-item">🍋</div>
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                    </div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-inner">
                        <div class="fruit-item">🍋</div>
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                        <div class="fruit-item">🍒</div>
                        <div class="fruit-item">🍋</div>
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                        <div class="fruit-item">🍒</div>
                    </div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-inner">
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                        <div class="fruit-item">🍒</div>
                        <div class="fruit-item">🍋</div>
                        <div class="fruit-item">🍊</div>
                        <div class="fruit-item">🍉</div>
                        <div class="fruit-item">🍇</div>
                        <div class="fruit-item">🍓</div>
                        <div class="fruit-item">🍒</div>
                        <div class="fruit-item">🍋</div>
                    </div>
                </div>
            </div>
            <!-- Garis kemenangan -->
            <div class="winning-line"></div>
        </div>

        <!-- Tombol Spin -->
        <button id="spinBtn" class="spin-btn">🎰 SPIN!</button>

        <!-- Hasil -->
        <div class="result-box" id="resultDisplay">
            🎯 Tekan SPIN untuk mulai!
        </div>

        <!-- Info Kombinasi -->
        <div class="combo-info">
            <div class="combo-item">🍒🍒🍒 = 50 poin</div>
            <div class="combo-item">🍋🍋🍋 = 40 poin</div>
            <div class="combo-item">🍊🍊🍊 = 30 poin</div>
            <div class="combo-item">🍉🍉🍉 = 25 poin</div>
            <div class="combo-item">🍇🍇🍇 = 20 poin</div>
            <div class="combo-item">🍓🍓🍓 = 15 poin</div>
            <div class="combo-item">✨ 2 sama = 5 poin</div>
        </div>

        <!-- Tombol Reset -->
        <button id="resetBtn" class="reset-btn">⟳ Reset Skor</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
