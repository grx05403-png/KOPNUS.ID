<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤠 WANTED • Poster Permanen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤠 WANTED</h1>
        <p class="subtitle">Poster permanen • tidak bisa diubah</p>

        <div class="poster-wrapper">
            <!-- Stiker Wanted -->
            <div class="wanted-stiker" id="stikerWanted">
                <div class="stiker-header">★ WANTED ★</div>
                
                <div class="foto-container">
                    <div class="foto" id="fotoWanted">
                        <!-- Foto akan diisi oleh JS -->
                    </div>
                </div>

                <div class="nama" id="namaWanted">
                    <!-- Nama akan diisi oleh JS -->
                </div>

                <div class="gelar" id="gelarWanted">
                    <!-- Gelar akan diisi oleh JS -->
                </div>

                <div class="divider"></div>

                <div class="info-row">
                    <span class="label">⚖️ Kejahatan</span>
                    <span class="value" id="kejahatanWanted">PENJAHAT KELAMIN</span>
                </div>

                <div class="info-row">
                    <span class="label">💰 Hadiah</span>
                    <span class="value" id="hadiahWanted">$1.000.000</span>
                </div>

                <div class="info-row">
                    <span class="label">📍 Terakhir</span>
                    <span class="value" id="lokasiWanted">MANDATI TONGGA</span>
                </div>

                <div class="ciri" id="ciriWanted">
                    📌 Berkacamata hitam
                </div>

                <div class="footer-stiker">
                    ⭐ LAPORKAN SEGERA ⭐
                </div>
            </div>

            <!-- Tombol Download -->
            <button id="downloadBtn" class="btn-download">⬇️ Download Poster</button>
        </div>

        <!-- Informasi -->
        <div class="info-footer">
            <p>🔒 Poster ini sudah di-<strong>hardcode</strong> dan tidak dapat diubah oleh siapapun</p>
            <p class="credit">Untuk mengubah, edit file <strong>script.js</strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
